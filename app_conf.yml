temporal:
  target_host: 'TEMPORAL_HOST'
  namespace: "TEMPORAL_NAMESPACE"
  tls: "TEMPORAL_USE_TLS"
  api_key: 'TEMPORAL_KEY'

llm:
  gemini:
    api_key: 'GEMINI_API_KEY'
    model_name: "GEMINI_MODEL_NAME"
    settings:
      temperature: 0.5
      top_p: 0.7
      max_tokens: 65535
      parallel_tool_calls: true