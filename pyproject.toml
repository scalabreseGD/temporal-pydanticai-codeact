[project]
name = "code-act-pydanticai"
version = "0.1.0"
description = "Building agents with code execution capabilities using PydanticAI, Temporal, and Docker"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "docker>=7.1.0",
    "jinja2>=3.1.6",
    "pydantic-ai>=1.27.0",
    "temporalio>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
artifacts = [
    "src/docker_sandbox/sandbox/*.py",
    "src/docker_sandbox/sandbox/Dockerfile.pythonuv",
]
