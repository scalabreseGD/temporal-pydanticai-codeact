[project]
name = "temporal-pydanticai-codeact"
version = "0.1.0"
description = "A reusable library for building AI agents with safe code execution using PydanticAI, Temporal, and Docker"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["pydantic-ai", "temporal", "docker", "agents", "code-execution", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.124.0",
    "jinja2>=3.1.6",
    "pydantic-ai>=1.27.0",
    "python-multipart>=0.0.20",
    "temporalio>=1.19.0",
    "uvicorn[standard]>=0.38.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/code-act-pydanticai"
Documentation = "https://github.com/yourusername/code-act-pydanticai/tree/main/docs"
Repository = "https://github.com/yourusername/code-act-pydanticai"
Issues = "https://github.com/yourusername/code-act-pydanticai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temporal"]
artifacts = [
    "src/temporal/pydanticai/codeact/docker_sandbox/sandbox/*.py",
    "src/temporal/pydanticai/codeact/docker_sandbox/sandbox/Dockerfile.pythonuv",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.8",
]
